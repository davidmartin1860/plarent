name: Plarent
options:
  bundleIdPrefix: com.plarent
  deploymentTarget:
    iOS: "17.0"

targets:
  Plarent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plarent.ios
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Plarent
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true

schemes:
  Plarent:
    build:
      targets:
        Plarent: all
    run:
      config: Debug
    archive:
      config: Release
