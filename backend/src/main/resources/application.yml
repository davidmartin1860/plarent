spring:
  application:
    name: plarent-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/plarent
    username: plarent
    password: changeme
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

plarent:
  images:
    directory: ${PLANT_IMAGE_DIR:./data/plant-images}
    max-bytes: 5242880

server:
  port: 8080

logging:
  level:
    com.plarent.backend: INFO
