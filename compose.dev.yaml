# Hot-reload override for local development. Layer on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build --watch
# (or `task up`). Backend source changes are synced into the container; the web
# app is bind-mounted so large change sets (branch switches, bulk edits) land
# atomically instead of in partial sync batches. Dependency file changes
# trigger an image rebuild.

services:
  backend:
    build:
      target: dev
    volumes:
      # Keep the Gradle cache across container restarts/rebuilds.
      - backend-gradle-cache:/root/.gradle
      # compose.dev.yaml replaces the backend volume list, so the image store
      # declared in compose.yaml has to be repeated here.
      - plant-images:/data/plant-images
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/build.gradle.kts
        - action: rebuild
          path: ./backend/settings.gradle.kts
        - action: rebuild
          path: ./backend/gradle.properties

  web:
    build:
      target: dev
    volumes:
      - ./web:/app
      # Keep the container's Linux node_modules / build cache, not the host's macOS ones.
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/package-lock.json

volumes:
  backend-gradle-cache:
